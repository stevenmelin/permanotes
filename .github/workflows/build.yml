name: Build PermaNotes

# Installers go straight onto a GitHub Release (no Actions artifact storage used).
# iPhone web app is published to the gh-pages branch -> https://stevenmelin.github.io/permanotes/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Static audit (no dependencies)
        run: node tools/audit.mjs
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build iPhone web app
        run: npm run build:web
      - name: Publish iPhone web app (gh-pages branch)
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Web app ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - id: tag
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "PermaNotes ${{ steps.tag.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Windows: download the Setup .exe. Mac: download the .dmg. iPhone: open https://stevenmelin.github.io/permanotes/ in Safari and Add to Home Screen. See the START HERE files in the Source zip."

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build app (windows\Build Windows App.bat)
        shell: cmd
        run: call "windows\Build Windows App.bat"
      - name: Build installer (windows\Build Windows Installer.bat)
        shell: cmd
        run: call "windows\Build Windows Installer.bat"
      - name: Attach installer to release
        shell: bash
        run: gh release upload "${{ needs.check.outputs.tag }}" release/*-Windows-Setup.exe --clobber

  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build app (mac/Build Mac App.command)
        run: '"mac/Build Mac App.command"'
      - name: Build DMG (mac/Build Mac DMG.command)
        run: '"mac/Build Mac DMG.command"'
      - name: Attach DMG to release
        run: gh release upload "${{ needs.check.outputs.tag }}" release/*-Mac.dmg --clobber

  publish:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach source zip and publish
        run: |
          Z="PermaNotes-${{ needs.check.outputs.version }}-Source.zip"
          git archive --format=zip --prefix=permanotes/ -o "$Z" HEAD
          gh release upload "${{ needs.check.outputs.tag }}" "$Z" --clobber
          gh release edit "${{ needs.check.outputs.tag }}" --draft=false --latest
